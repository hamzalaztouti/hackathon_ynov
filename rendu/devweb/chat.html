<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TechCorp Financial Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 30px auto; background:#0f1115; color:#e6e6e6; }
  h1 { font-size: 1.3rem; display:flex; align-items:center; gap:10px; }
  #status { font-size: 0.85rem; padding: 4px 10px; border-radius: 12px; }
  .ok { background:#1f7a3f; color:#fff; }
  .ko { background:#7a1f1f; color:#fff; }
  #chat { border:1px solid #2a2d36; border-radius:8px; height:480px; overflow-y:auto; padding:14px; background:#15171c; margin-bottom:12px; }
  .msg { margin:10px 0; line-height:1.4; white-space:pre-wrap; }
  .user { text-align:right; }
  .user span { background:#2563eb; padding:8px 12px; border-radius:10px; display:inline-block; max-width:80%; }
  .bot span { background:#262a33; padding:8px 12px; border-radius:10px; display:inline-block; max-width:80%; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px; border-radius:6px; border:1px solid #2a2d36; background:#15171c; color:#fff; }
  button { padding:10px 18px; border-radius:6px; border:none; background:#2563eb; color:#fff; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
</style>
</head>
<body>

<h1>TechCorp Financial Assistant <span id="status" class="ko">déconnecté</span></h1>
<div id="chat"></div>
<form id="form">
  <input id="input" placeholder="Posez votre question financière..." autocomplete="off" />
  <button id="send" type="submit">Envoyer</button>
</form>

<script>
const OLLAMA_URL = "http://localhost:11434";
const MODEL_NAME = "techcorp-financial";

const chatEl = document.getElementById("chat");
const formEl = document.getElementById("form");
const inputEl = document.getElementById("input");
const statusEl = document.getElementById("status");
const sendBtn = document.getElementById("send");
let history = [];

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  div.innerHTML = `<span></span>`;
  div.querySelector("span").textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div.querySelector("span");
}

async function checkConnection() {
  try {
    const res = await fetch(`${OLLAMA_URL}/api/tags`);
    if (res.ok) {
      statusEl.textContent = "connecté";
      statusEl.className = "ok";
      return true;
    }
  } catch (e) {}
  statusEl.textContent = "déconnecté";
  statusEl.className = "ko";
  return false;
}

formEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendBtn.disabled = true;
  addMessage("user", text);
  history.push({ role: "user", content: text });
  const botSpan = addMessage("bot", "...");

  try {
    const res = await fetch(`${OLLAMA_URL}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL_NAME, messages: history, stream: true })
    });
    if (!res.ok || !res.body) throw new Error("Erreur serveur");

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = "";
    botSpan.textContent = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split("\n").filter(Boolean)) {
        try {
          const json = JSON.parse(line);
          if (json.message?.content) {
            fullText += json.message.content;
            botSpan.textContent = fullText;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch (_) {}
      }
    }
    history.push({ role: "assistant", content: fullText });
    statusEl.textContent = "connecté";
    statusEl.className = "ok";
  } catch (err) {
    botSpan.textContent = "⚠️ Impossible de contacter le serveur Ollama (" + err.message + ")";
    statusEl.textContent = "déconnecté";
    statusEl.className = "ko";
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
});

checkConnection();
setInterval(checkConnection, 5000);
</script>
</body>
</html>
